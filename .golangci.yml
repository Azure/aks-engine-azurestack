version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    govet:
      disable:
        - inline
    staticcheck:
      checks:
        - "SA*"
        - "S*"
        - "-ST*"
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - pkg/i18n/i18n.go
      - pkg/i18n/translations.go
      - test/i18n
      - pkg/test
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - pkg/i18n/i18n.go
      - pkg/i18n/translations.go
      - test/i18n
      - pkg/test
      - third_party$
      - builtin$
      - examples$
